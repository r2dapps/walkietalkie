<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antenna -->
  <rect x="180" y="30" width="24" height="130" rx="6" fill="url(#metalGrad)" />
  <rect x="174" y="20" width="36" height="20" rx="4" fill="#090d16" />
  <circle cx="192" cy="20" r="8" fill="#f43f5e" />

  <!-- Volume Knob -->
  <rect x="300" y="80" width="40" height="70" rx="8" fill="url(#metalGrad)" />
  <line x1="320" y1="80" x2="320" y2="150" stroke="#0f172a" stroke-width="4" />

  <!-- Main Body -->
  <rect x="130" y="140" width="252" height="340" rx="36" fill="url(#bodyGrad)" stroke="#334155" stroke-width="6" />

  <!-- Side Grip Bumpers -->
  <rect x="116" y="200" width="14" height="120" rx="6" fill="#090d16" />
  <rect x="382" y="200" width="14" height="120" rx="6" fill="#090d16" />

  <!-- Display Screen -->
  <rect x="160" y="175" width="192" height="90" rx="16" fill="url(#screenGrad)" stroke="#10b981" stroke-width="3" />
  <!-- Screen Text / UI Graphic -->
  <text x="175" y="210" font-family="monospace" font-size="14" font-weight="bold" fill="#34d399">FREQ: 146.520</text>
  <text x="175" y="235" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">#TACTICAL-ALPHA</text>
  <circle cx="330" cy="205" r="5" fill="#10b981" filter="url(#glow)" />
  <text x="315" y="245" font-family="sans-serif" font-size="10" fill="#6ee7b7">CH: 01</text>

  <!-- LEDs -->
  <circle cx="165" cy="290" r="7" fill="#ef4444" /> <!-- TX LED -->
  <text x="178" y="294" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">TX</text>

  <circle cx="235" cy="290" r="7" fill="#10b981" /> <!-- RX LED -->
  <text x="248" y="294" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">RX</text>

  <circle cx="305" cy="290" r="7" fill="#f59e0b" /> <!-- PWR LED -->
  <text x="318" y="294" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">BAT</text>

  <!-- Speaker Grille -->
  <g fill="#090d16">
    <rect x="180" y="325" width="152" height="10" rx="5" />
    <rect x="190" y="343" width="132" height="10" rx="5" />
    <rect x="200" y="361" width="112" height="10" rx="5" />
    <rect x="210" y="379" width="92" height="10" rx="5" />
  </g>

  <!-- Large Central PTT Button Icon Overlay -->
  <circle cx="256" cy="425" r="30" fill="url(#accentGrad)" stroke="#fecdd3" stroke-width="3" filter="url(#glow)" />
  <path d="M256 410 v20 M246 420 h20" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
</svg>
